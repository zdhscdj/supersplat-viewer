<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DGS Studio - Spark.js 2.0 Tool</title>
    <link rel="stylesheet" href="./tool.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.0.0/spark.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <!-- 3D Canvas -->
        <canvas id="viewport"></canvas>

        <!-- Top Toolbar -->
        <div id="toolbar">
            <div class="toolbar-group">
                <button id="btn-load" class="tool-btn" title="Load Model (.ply/.splat/.spz/.ksplat)">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                    <span>Load</span>
                </button>
                <input type="file" id="file-input" accept=".ply,.splat,.spz,.ksplat" hidden>
            </div>
            <div class="toolbar-group mode-tabs">
                <button class="mode-btn active" data-mode="view">View</button>
                <button class="mode-btn" data-mode="clean">Clean</button>
                <button class="mode-btn" data-mode="path">Path</button>
                <button class="mode-btn" data-mode="export">Export</button>
            </div>
            <div class="toolbar-group">
                <button id="btn-undo" class="tool-btn" title="Undo">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                </button>
                <button id="btn-redo" class="tool-btn" title="Redo">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
                </button>
            </div>
        </div>

        <!-- Left Panel: Tools -->
        <div id="left-panel">
            <!-- View Mode Panel -->
            <div class="panel-section" data-panel="view">
                <h3>Camera</h3>
                <div class="control-row">
                    <label>Mode</label>
                    <select id="camera-mode">
                        <option value="orbit">Orbit</option>
                        <option value="fly">Fly</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>FOV</label>
                    <input type="range" id="fov-slider" min="20" max="120" value="60">
                    <span id="fov-value">60</span>
                </div>
                <button id="btn-frame" class="panel-btn">Frame Scene</button>
                <button id="btn-reset-camera" class="panel-btn">Reset Camera</button>
            </div>

            <!-- Clean Mode Panel -->
            <div class="panel-section hidden" data-panel="clean">
                <h3>Brush Tool</h3>
                <div class="control-row">
                    <label>Tool</label>
                    <select id="clean-tool">
                        <option value="brush">Brush Erase</option>
                        <option value="box">Box Select</option>
                        <option value="sphere">Sphere Select</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Radius</label>
                    <input type="range" id="brush-radius" min="1" max="100" value="20">
                    <span id="radius-value">20</span>
                </div>
                <div class="control-row">
                    <label>Opacity</label>
                    <input type="range" id="brush-opacity" min="0" max="100" value="0">
                    <span id="opacity-value">0%</span>
                </div>
                <h3>Auto Filter</h3>
                <div class="control-row">
                    <label>Float Threshold</label>
                    <input type="range" id="float-threshold" min="0" max="100" value="50">
                    <span id="threshold-value">50</span>
                </div>
                <div class="control-row">
                    <label>Min Neighbors</label>
                    <input type="range" id="min-neighbors" min="1" max="20" value="3">
                    <span id="neighbors-value">3</span>
                </div>
                <button id="btn-auto-filter" class="panel-btn accent">Auto Remove Floaters</button>
                <button id="btn-invert-selection" class="panel-btn">Invert Selection</button>
                <button id="btn-delete-selected" class="panel-btn danger">Delete Selected</button>
            </div>

            <!-- Path Mode Panel -->
            <div class="panel-section hidden" data-panel="path">
                <h3>Camera Path</h3>
                <div class="control-row">
                    <label>Preset</label>
                    <select id="path-preset">
                        <option value="orbit360">Orbit 360</option>
                        <option value="flythrough">Fly Through</option>
                        <option value="dolly">Dolly Zoom</option>
                        <option value="spiral">Spiral Up</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Duration (s)</label>
                    <input type="number" id="path-duration" min="1" max="120" value="10">
                </div>
                <div class="control-row">
                    <label>Easing</label>
                    <select id="path-easing">
                        <option value="linear">Linear</option>
                        <option value="easeInOut">Ease In-Out</option>
                        <option value="easeIn">Ease In</option>
                        <option value="easeOut">Ease Out</option>
                    </select>
                </div>
                <button id="btn-add-keyframe" class="panel-btn accent">+ Add Keyframe</button>
                <button id="btn-generate-path" class="panel-btn">Generate Optimal Path</button>
                <div id="keyframe-list"></div>
                <h3>Preview</h3>
                <button id="btn-preview-play" class="panel-btn">Play Preview</button>
                <button id="btn-preview-stop" class="panel-btn">Stop</button>
                <div class="control-row">
                    <label>Time</label>
                    <input type="range" id="preview-time" min="0" max="100" value="0" step="0.1">
                </div>
            </div>

            <!-- Export Mode Panel -->
            <div class="panel-section hidden" data-panel="export">
                <h3>Export Video</h3>
                <div class="control-row">
                    <label>Resolution</label>
                    <select id="export-resolution">
                        <option value="1920x1080">1080p (1920x1080)</option>
                        <option value="1280x720">720p (1280x720)</option>
                        <option value="3840x2160">4K (3840x2160)</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>FPS</label>
                    <select id="export-fps">
                        <option value="24">24</option>
                        <option value="30" selected>30</option>
                        <option value="60">60</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Bitrate (Mbps)</label>
                    <input type="number" id="export-bitrate" min="1" max="50" value="8">
                </div>
                <button id="btn-export-mp4" class="panel-btn accent">Export MP4</button>
                <div id="export-progress" class="hidden">
                    <div class="progress-bar"><div class="progress-fill"></div></div>
                    <span class="progress-text">0%</span>
                </div>
                <h3>Export Model</h3>
                <button id="btn-export-ply" class="panel-btn">Export Cleaned .ply</button>
            </div>
        </div>

        <!-- Bottom Timeline -->
        <div id="timeline" class="hidden">
            <div class="timeline-track">
                <div class="timeline-playhead"></div>
                <div class="timeline-keyframes"></div>
            </div>
            <div class="timeline-info">
                <span id="timeline-time">0.0s</span> / <span id="timeline-duration">10.0s</span>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <span id="status-text">Initializing...</span>
            <span id="splat-count">Splats: 0</span>
            <span id="fps-counter">FPS: 0</span>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="hidden">
            <div class="loading-content">
                <div class="spinner"></div>
                <p id="loading-text">Loading model...</p>
                <div class="progress-bar"><div class="progress-fill" id="loading-progress"></div></div>
            </div>
        </div>

        <!-- Brush Cursor (for clean mode) -->
        <div id="brush-cursor" class="hidden"></div>
    </div>

    <!-- UI事件先绑定 -->
    <script>
    // 先绑定文件按钮，确保可以响应
    document.getElementById('btn-load').addEventListener('click', function() {
        document.getElementById('file-input').value = '';
        document.getElementById('file-input').click();
    });
    </script>
    <!-- 主引擎用 module 方式加载，依赖 importmap -->
    <script type="module">
    (function() {
        'use strict';

        // ========== 状态 ==========
        var engine = null;       // 3D engine (lazy loaded)
        var pendingFile = null;  // 如果用户在引擎加载前就选了文件
        var mode = 'view';
        var engineReady = false;

        // ========== UI 引用 ==========
        var statusText = document.getElementById('status-text');
        var splatCount = document.getElementById('splat-count');
        var fpsCounter = document.getElementById('fps-counter');
        var loadingOverlay = document.getElementById('loading-overlay');
        var loadingTextEl = document.getElementById('loading-text');
        var loadingProgress = document.getElementById('loading-progress');

        function setStatus(text) {
            if (statusText) statusText.textContent = text;
            console.log('[3DGS Studio] ' + text);
        }

        function showLoading(text) {
            if (loadingOverlay) loadingOverlay.classList.remove('hidden');
            if (loadingTextEl) loadingTextEl.textContent = text;
            if (loadingProgress) loadingProgress.style.width = '0%';
        }

        function hideLoading() {
            if (loadingOverlay) loadingOverlay.classList.add('hidden');
        }

        // ========== 文件加载按钮（立即绑定）==========
        var fileInput = document.getElementById('file-input');
        var btnLoad = document.getElementById('btn-load');

        btnLoad.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            fileInput.value = '';
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            var files = e.target.files;
            if (!files || files.length === 0) return;
            var file = files[0];
            var ext = file.name.split('.').pop().toLowerCase();

            if (['ply', 'splat', 'spz', 'ksplat'].indexOf(ext) === -1) {
                setStatus('Unsupported format. Use .ply, .splat, .spz, or .ksplat');
                return;
            }

            setStatus('File selected: ' + file.name);

            if (engineReady && engine) {
                loadModelFile(file);
            } else {
                pendingFile = file;
                setStatus('File queued: ' + file.name + ' (waiting for engine...)');
            }
        });

        // ========== 拖拽 ==========
        var appEl = document.getElementById('app');

        appEl.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
            appEl.classList.add('drag-over');
        });
        appEl.addEventListener('dragleave', function(e) {
            e.preventDefault();
            appEl.classList.remove('drag-over');
        });
        appEl.addEventListener('drop', function(e) {
            e.preventDefault();
            e.stopPropagation();
            appEl.classList.remove('drag-over');
            var files = e.dataTransfer && e.dataTransfer.files;
            if (!files || files.length === 0) return;
            var file = files[0];
            if (engineReady && engine) {
                loadModelFile(file);
            } else {
                pendingFile = file;
                setStatus('File queued: ' + file.name + ' (waiting for engine...)');
            }
        });

        // ========== Mode 切换 ==========
        document.querySelectorAll('.mode-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                setMode(btn.dataset.mode);
            });
        });

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            document.querySelectorAll('.panel-section').forEach(function(panel) {
                panel.classList.toggle('hidden', panel.dataset.panel !== mode);
            });
            var timeline = document.getElementById('timeline');
            if (timeline) timeline.classList.toggle('hidden', mode !== 'path');

            if (engine && engine.setMode) engine.setMode(mode);
            setStatus('Mode: ' + mode.charAt(0).toUpperCase() + mode.slice(1));
        }

        // ========== 加载模型 ==========
        async function loadModelFile(file) {
            if (!engine) {
                setStatus('Engine not ready');
                return;
            }
            showLoading('Loading ' + file.name + '...');
            try {
                var result = await engine.loadModel(file, function(progress) {
                    if (loadingProgress) loadingProgress.style.width = (progress * 100) + '%';
                    if (loadingTextEl) loadingTextEl.textContent = 'Loading... ' + Math.round(progress * 100) + '%';
                });
                hideLoading();
                if (splatCount) splatCount.textContent = 'Splats: ' + (result.splatCount || 0).toLocaleString();
                setStatus('Loaded ' + file.name + ' - ' + (result.splatCount || 0).toLocaleString() + ' splats');
            } catch (err) {
                hideLoading();
                setStatus('Load error: ' + err.message);
                console.error(err);
            }
        }

        // ========== 3D 引擎异步加载 ==========
        setStatus('Loading 3D engine...');

        async function initEngine() {
            try {
                // 直接用 importmap 中定义的 bare specifier
                var THREE = await import('three');
                setStatus('THREE.js loaded. Loading Spark.js...');

                var sparkModule = null;
                try {
                    sparkModule = await import('@sparkjsdev/spark');
                    console.log('[3DGS] Spark.js loaded! Exports:', Object.keys(sparkModule));
                } catch(sparkErr) {
                    console.error('[3DGS] Spark.js load FAILED:', sparkErr);
                    setStatus('Spark.js load error: ' + sparkErr.message);
                }

                engine = createEngine(THREE, sparkModule);
                engineReady = true;

                if (sparkModule) {
                    setStatus('Ready - Drop a .ply/.splat/.spz/.ksplat file or click Load');
                } else {
                    setStatus('Ready (Spark.js unavailable - see F12 console for fix)');
                }

                // 处理等待中的文件
                if (pendingFile) {
                    var f = pendingFile;
                    pendingFile = null;
                    loadModelFile(f);
                }
            } catch(err) {
                console.error('Engine load failed:', err);
                setStatus('Engine load failed: ' + err.message);
            }
        }

        function createEngine(THREE, sparkModule) {
            var canvas = document.getElementById('viewport');
            var scene = new THREE.Scene();
            var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
            camera.position.set(2, 1.5, 3);

            var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x1a1a2e);

            // Spark renderer - 必须传入 renderer
            var sparkRenderer = null;
            if (sparkModule && sparkModule.SparkRenderer) {
                try {
                    sparkRenderer = new sparkModule.SparkRenderer({ renderer: renderer });
                    scene.add(sparkRenderer);
                    console.log('[3DGS] SparkRenderer initialized');
                } catch(e) {
                    console.warn('SparkRenderer init failed:', e);
                    // 尝试不带参数
                    try {
                        sparkRenderer = new sparkModule.SparkRenderer();
                        scene.add(sparkRenderer);
                    } catch(e2) {
                        console.warn('SparkRenderer fallback failed:', e2);
                    }
                }
            }

            // Grid
            var grid = new THREE.GridHelper(10, 20, 0x333366, 0x222244);
            scene.add(grid);

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            scene.add(dirLight);

            // Also adjust camera near/far planes for various model scales
            camera.near = 0.001;
            camera.far = 10000;
            camera.updateProjectionMatrix();

            // Orbit controls (inline simple version)
            var target = new THREE.Vector3(0, 0, 0);
            var spherical = { radius: 5, phi: Math.PI / 3, theta: Math.PI / 4 };
            var isDown = false, pBtn = -1, lastX = 0, lastY = 0;

            canvas.addEventListener('pointerdown', function(e) {
                isDown = true; pBtn = e.button;
                lastX = e.clientX; lastY = e.clientY;
                canvas.setPointerCapture(e.pointerId);
            });
            canvas.addEventListener('pointermove', function(e) {
                if (!isDown) return;
                var dx = e.clientX - lastX, dy = e.clientY - lastY;
                lastX = e.clientX; lastY = e.clientY;
                if (pBtn === 0) {
                    spherical.theta -= dx * 0.005;
                    spherical.phi -= dy * 0.005;
                    spherical.phi = Math.max(0.01, Math.min(Math.PI - 0.01, spherical.phi));
                } else if (pBtn === 2) {
                    var right = new THREE.Vector3();
                    var up = new THREE.Vector3();
                    right.setFromMatrixColumn(camera.matrixWorld, 0);
                    up.setFromMatrixColumn(camera.matrixWorld, 1);
                    target.addScaledVector(right, -dx * 0.003 * spherical.radius * 0.5);
                    target.addScaledVector(up, dy * 0.003 * spherical.radius * 0.5);
                }
            });
            canvas.addEventListener('pointerup', function(e) {
                isDown = false; pBtn = -1;
                canvas.releasePointerCapture(e.pointerId);
            });
            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                spherical.radius *= 1 + e.deltaY * 0.001;
                spherical.radius = Math.max(0.001, Math.min(10000, spherical.radius));
            }, { passive: false });
            canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

            function updateCamera() {
                var x = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
                var y = spherical.radius * Math.cos(spherical.phi);
                var z = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
                camera.position.set(target.x + x, target.y + y, target.z + z);
                camera.lookAt(target);
            }

            // Resize
            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Render loop
            function loop() {
                requestAnimationFrame(loop);
                updateCamera();
                renderer.render(scene, camera);
                frameCount++;
                var now = performance.now();
                if (now - lastFpsTime >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastFpsTime = now;
                    if (fpsCounter) fpsCounter.textContent = 'FPS: ' + fps;
                }
            }
            loop();

            // API
            return {
                loadModel: async function(file, onProgress) {
                    if (!sparkModule || !sparkModule.SplatMesh) {
                        throw new Error('Spark.js not loaded. Cannot load splat files.');
                    }

                    if (splatMesh) {
                        scene.remove(splatMesh);
                        if (splatMesh.dispose) splatMesh.dispose();
                        splatMesh = null;
                    }

                    var url = URL.createObjectURL(file);
                    var ext = file.name.split('.').pop().toLowerCase();

                    // 重要: blob URL 没有扩展名后缀，必须显式指定 fileType
                    var opts = { url: url, fileType: ext };
                    console.log('[3DGS] Creating SplatMesh with:', opts);

                    var newMesh;
                    try {
                        newMesh = new sparkModule.SplatMesh(opts);
                    } catch(constructErr) {
                        console.error('SplatMesh constructor error:', constructErr);
                        try {
                            newMesh = new sparkModule.SplatMesh();
                            if (newMesh.loadAsync) {
                                await newMesh.loadAsync(url, { fileType: ext });
                            } else if (newMesh.load) {
                                await newMesh.load(url, { fileType: ext });
                            }
                        } catch(e2) {
                            URL.revokeObjectURL(url);
                            throw e2;
                        }
                    }

                    splatMesh = newMesh;
                    scene.add(splatMesh);
                    console.log('[3DGS] SplatMesh added to scene:', splatMesh);

                    if (onProgress) onProgress(1);

                    // 等待模型实际加载完成（SplatMesh 的 url 加载是异步的）
                    // 轮询等待 packedSplats 就绪
                    var count = 0;
                    var waited = 0;
                    while (waited < 30000) { // 最多等30秒
                        if (splatMesh.packedSplats && splatMesh.packedSplats.splatCount > 0) {
                            count = splatMesh.packedSplats.splatCount;
                            break;
                        }
                        // 检查是否有 loaded/ready 事件
                        if (splatMesh.loaded || splatMesh.ready) {
                            count = splatMesh.packedSplats?.splatCount || splatMesh.count || 0;
                            break;
                        }
                        await new Promise(function(r) { setTimeout(r, 200); });
                        waited += 200;
                        if (onProgress) onProgress(Math.min(0.9, waited / 10000));
                    }

                    if (onProgress) onProgress(1);

                    // Auto frame - 多次尝试，因为 Spark 异步初始化 bounding box
                    var frameAttempts = 0;
                    function autoFrame() {
                        try {
                            // Spark.js 自带的 packedSplats.bounds 更准确
                            var center = new THREE.Vector3(0, 0, 0);
                            var radius = 3;

                            if (splatMesh.packedSplats && splatMesh.packedSplats.getBounds) {
                                var bounds = splatMesh.packedSplats.getBounds();
                                if (bounds && bounds.center) {
                                    center.fromArray(bounds.center);
                                    radius = bounds.radius || 3;
                                }
                            } else {
                                var box = new THREE.Box3().setFromObject(splatMesh);
                                if (!box.isEmpty()) {
                                    box.getCenter(center);
                                    var size = new THREE.Vector3();
                                    box.getSize(size);
                                    radius = size.length() * 0.5;
                                }
                            }

                            // 安全的相机距离
                            radius = Math.max(radius, 0.5);
                            target.copy(center);
                            spherical.radius = radius * 2.5;
                            console.log('[3DGS] Camera framed - center:', center, 'radius:', spherical.radius);
                        } catch(frameErr) {
                            console.warn('Auto frame failed:', frameErr);
                            // 失败也设置一个合理的默认相机
                            target.set(0, 0, 0);
                            spherical.radius = 5;
                        }

                        frameAttempts++;
                        if (frameAttempts < 5) setTimeout(autoFrame, 500);
                    }
                    setTimeout(autoFrame, 500);

                    return { splatCount: count };
                },
                setMode: function(m) { /* TODO */ }
            };
        }

        // 启动引擎加载
        initEngine();

    })();
    </script>
</body>
</html>
