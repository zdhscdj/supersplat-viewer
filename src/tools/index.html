<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DGS Studio - Spark.js 2.0 Tool</title>
    <link rel="stylesheet" href="./tool.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.0.0/spark.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="app">
        <!-- 3D Canvas -->
        <canvas id="viewport" tabindex="0"></canvas>

        <!-- Top Toolbar -->
        <div id="toolbar">
            <div class="toolbar-group">
                <button id="btn-load" class="tool-btn" title="Load single file (.ply/.splat/.spz/.ksplat)">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
                    <span>Load File</span>
                </button>
                <button id="btn-load-folder" class="tool-btn" title="Load 3DGS scene folder (SIBR style)">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M10 4H4c-1.11 0-2 .89-2 2v12c0 1.097.903 2 2 2h16c1.097 0 2-.903 2-2V8c0-1.11-.9-2-2-2h-8l-2-2z"/></svg>
                    <span>Load Folder</span>
                </button>
                <input type="file" id="file-input" accept=".ply,.splat,.spz,.ksplat" hidden>
                <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
            </div>
            <div class="toolbar-group mode-tabs">
                <button class="mode-btn active" data-mode="view">View</button>
                <button class="mode-btn" data-mode="clean">Clean</button>
                <button class="mode-btn" data-mode="path">Path</button>
                <button class="mode-btn" data-mode="export">Export</button>
            </div>
            <div class="toolbar-group">
                <button id="btn-undo" class="tool-btn" title="Undo">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
                </button>
                <button id="btn-redo" class="tool-btn" title="Redo">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
                </button>
            </div>
        </div>

        <!-- Left Panel: Tools -->
        <div id="left-panel">
            <!-- View Mode Panel -->
            <div class="panel-section" data-panel="view">
                <h3>Camera</h3>
                <div class="control-row">
                    <label>Mode</label>
                    <select id="camera-mode">
                        <option value="orbit">Orbit</option>
                        <option value="fly">Fly</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>FOV</label>
                    <input type="range" id="fov-slider" min="20" max="120" value="60">
                    <span id="fov-value">60</span>
                </div>
                <button id="btn-frame" class="panel-btn">Frame Scene</button>
                <button id="btn-reset-camera" class="panel-btn">Reset Camera</button>
            </div>

            <!-- Clean Mode Panel -->
            <div class="panel-section hidden" data-panel="clean">
                <h3>Brush Tool</h3>
                <div class="control-row">
                    <label>Tool</label>
                    <select id="clean-tool">
                        <option value="brush">Brush Erase</option>
                        <option value="box">Box Select</option>
                        <option value="sphere">Sphere Select</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Radius</label>
                    <input type="range" id="brush-radius" min="1" max="100" value="20">
                    <span id="radius-value">20</span>
                </div>
                <div class="control-row">
                    <label>Opacity</label>
                    <input type="range" id="brush-opacity" min="0" max="100" value="0">
                    <span id="opacity-value">0%</span>
                </div>
                <h3>Auto Filter</h3>
                <div class="control-row">
                    <label>Float Threshold</label>
                    <input type="range" id="float-threshold" min="0" max="100" value="50">
                    <span id="threshold-value">50</span>
                </div>
                <div class="control-row">
                    <label>Min Neighbors</label>
                    <input type="range" id="min-neighbors" min="1" max="20" value="3">
                    <span id="neighbors-value">3</span>
                </div>
                <button id="btn-auto-filter" class="panel-btn accent">Auto Remove Floaters</button>
                <button id="btn-invert-selection" class="panel-btn">Invert Selection</button>
                <button id="btn-delete-selected" class="panel-btn danger">Delete Selected</button>
            </div>

            <!-- Path Mode Panel -->
            <div class="panel-section hidden" data-panel="path">
                <h3>Camera Path</h3>
                <div class="control-row">
                    <label>Preset</label>
                    <select id="path-preset">
                        <option value="orbit360">Orbit 360</option>
                        <option value="flythrough">Fly Through</option>
                        <option value="dolly">Dolly Zoom</option>
                        <option value="spiral">Spiral Up</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Duration (s)</label>
                    <input type="number" id="path-duration" min="1" max="120" value="10">
                </div>
                <div class="control-row">
                    <label>Easing</label>
                    <select id="path-easing">
                        <option value="linear">Linear</option>
                        <option value="easeInOut">Ease In-Out</option>
                        <option value="easeIn">Ease In</option>
                        <option value="easeOut">Ease Out</option>
                    </select>
                </div>
                <button id="btn-add-keyframe" class="panel-btn accent">+ Add Keyframe</button>
                <button id="btn-generate-path" class="panel-btn">Generate Optimal Path</button>
                <div id="keyframe-list"></div>
                <h3>Preview</h3>
                <button id="btn-preview-play" class="panel-btn">Play Preview</button>
                <button id="btn-preview-stop" class="panel-btn">Stop</button>
                <div class="control-row">
                    <label>Time</label>
                    <input type="range" id="preview-time" min="0" max="100" value="0" step="0.1">
                </div>
            </div>

            <!-- Export Mode Panel -->
            <div class="panel-section hidden" data-panel="export">
                <h3>Export Video</h3>
                <div class="control-row">
                    <label>Resolution</label>
                    <select id="export-resolution">
                        <option value="1920x1080">1080p (1920x1080)</option>
                        <option value="1280x720">720p (1280x720)</option>
                        <option value="3840x2160">4K (3840x2160)</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>FPS</label>
                    <select id="export-fps">
                        <option value="24">24</option>
                        <option value="30" selected>30</option>
                        <option value="60">60</option>
                    </select>
                </div>
                <div class="control-row">
                    <label>Bitrate (Mbps)</label>
                    <input type="number" id="export-bitrate" min="1" max="50" value="8">
                </div>
                <button id="btn-export-mp4" class="panel-btn accent">Export MP4</button>
                <div id="export-progress" class="hidden">
                    <div class="progress-bar"><div class="progress-fill"></div></div>
                    <span class="progress-text">0%</span>
                </div>
                <h3>Export Model</h3>
                <button id="btn-export-ply" class="panel-btn">Export Cleaned .ply</button>
            </div>
        </div>

        <!-- Bottom Timeline -->
        <div id="timeline" class="hidden">
            <div class="timeline-track">
                <div class="timeline-playhead"></div>
                <div class="timeline-keyframes"></div>
            </div>
            <div class="timeline-info">
                <span id="timeline-time">0.0s</span> / <span id="timeline-duration">10.0s</span>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <span id="status-text">Initializing...</span>
            <span id="splat-count">Splats: 0</span>
            <span id="fps-counter">FPS: 0</span>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay" class="hidden">
            <div class="loading-content">
                <div class="spinner"></div>
                <p id="loading-text">Loading model...</p>
                <div class="progress-bar"><div class="progress-fill" id="loading-progress"></div></div>
            </div>
        </div>

        <!-- Brush Cursor (for clean mode) -->
        <div id="brush-cursor" class="hidden"></div>
    </div>

    <!-- UI事件先绑定 -->
    <script>
    // 先绑定文件按钮，确保可以响应
    document.getElementById('btn-load').addEventListener('click', function() {
        document.getElementById('file-input').value = '';
        document.getElementById('file-input').click();
    });
    document.getElementById('btn-load-folder').addEventListener('click', function() {
        document.getElementById('folder-input').value = '';
        document.getElementById('folder-input').click();
    });
    </script>
    <!-- 主引擎用 module 方式加载，依赖 importmap -->
    <script type="module">
    (function() {
        'use strict';

        // ========== 状态 ==========
        var engine = null;       // 3D engine (lazy loaded)
        var pendingFile = null;  // 如果用户在引擎加载前就选了文件
        var mode = 'view';
        var engineReady = false;

        // ========== UI 引用 ==========
        var statusText = document.getElementById('status-text');
        var splatCount = document.getElementById('splat-count');
        var fpsCounter = document.getElementById('fps-counter');
        var loadingOverlay = document.getElementById('loading-overlay');
        var loadingTextEl = document.getElementById('loading-text');
        var loadingProgress = document.getElementById('loading-progress');

        function setStatus(text) {
            if (statusText) statusText.textContent = text;
            console.log('[3DGS Studio] ' + text);
        }

        function showLoading(text) {
            if (loadingOverlay) loadingOverlay.classList.remove('hidden');
            if (loadingTextEl) loadingTextEl.textContent = text;
            if (loadingProgress) loadingProgress.style.width = '0%';
        }

        function hideLoading() {
            if (loadingOverlay) loadingOverlay.classList.add('hidden');
        }

        // ========== 文件加载按钮（立即绑定）==========
        var fileInput = document.getElementById('file-input');
        var folderInput = document.getElementById('folder-input');
        var btnLoad = document.getElementById('btn-load');
        var btnLoadFolder = document.getElementById('btn-load-folder');
        var sceneCameras = null; // SIBR cameras.json 解析结果

        btnLoad.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            fileInput.value = '';
            fileInput.click();
        });

        btnLoadFolder.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            folderInput.value = '';
            folderInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            var files = e.target.files;
            if (!files || files.length === 0) return;
            var file = files[0];
            var ext = file.name.split('.').pop().toLowerCase();

            if (['ply', 'splat', 'spz', 'ksplat'].indexOf(ext) === -1) {
                setStatus('Unsupported format. Use .ply, .splat, .spz, or .ksplat');
                return;
            }

            setStatus('File selected: ' + file.name);

            if (engineReady && engine) {
                loadModelFile(file);
            } else {
                pendingFile = file;
                setStatus('File queued: ' + file.name + ' (waiting for engine...)');
            }
        });

        // SIBR-style 文件夹加载 - 自动找 .ply 模型和 cameras.json
        folderInput.addEventListener('change', async function(e) {
            var files = Array.from(e.target.files || []);
            if (files.length === 0) return;

            setStatus('Scanning folder: ' + files.length + ' files...');
            console.log('[3DGS] Folder selected with', files.length, 'files');

            // 1. 找 splat 模型文件 (.ply / .splat / .spz / .ksplat)
            var modelFile = null;
            var modelCandidates = files.filter(function(f) {
                var ext = f.name.split('.').pop().toLowerCase();
                return ['ply', 'splat', 'spz', 'ksplat'].indexOf(ext) !== -1;
            });

            if (modelCandidates.length === 0) {
                setStatus('No splat file (.ply/.splat/.spz/.ksplat) found in folder');
                return;
            }

            // 优先级: point_cloud/iteration_*/*.ply > scene.ply > point_cloud.ply > 任意.ply
            // SIBR 标准结构: scene/point_cloud/iteration_30000/point_cloud.ply
            modelCandidates.sort(function(a, b) {
                var pa = a.webkitRelativePath || a.name;
                var pb = b.webkitRelativePath || b.name;
                var sa = scoreModelPath(pa);
                var sb = scoreModelPath(pb);
                return sb - sa; // 高分在前
            });
            modelFile = modelCandidates[0];
            console.log('[3DGS] Selected model:', modelFile.webkitRelativePath || modelFile.name);

            // 2. 找 cameras.json (SIBR 训练相机轨迹)
            var camerasJson = files.find(function(f) {
                return f.name === 'cameras.json';
            });

            if (camerasJson) {
                try {
                    var text = await camerasJson.text();
                    sceneCameras = JSON.parse(text);
                    console.log('[3DGS] Loaded cameras.json with', sceneCameras.length, 'cameras');
                    setStatus('Found ' + sceneCameras.length + ' training cameras');
                } catch(err) {
                    console.warn('[3DGS] Failed to parse cameras.json:', err);
                    sceneCameras = null;
                }
            }

            // 3. 找 cfg_args (可选 - 包含场景配置)
            var cfgArgs = files.find(function(f) { return f.name === 'cfg_args'; });
            if (cfgArgs) {
                console.log('[3DGS] Found cfg_args');
            }

            setStatus('Loading model: ' + modelFile.name);

            if (engineReady && engine) {
                loadModelFile(modelFile);
            } else {
                pendingFile = modelFile;
                setStatus('File queued: ' + modelFile.name + ' (waiting for engine...)');
            }
        });

        // SIBR 路径优先级评分: 越高越优先
        function scoreModelPath(path) {
            var score = 0;
            var lower = path.toLowerCase();
            // 完美匹配标准 SIBR 路径
            if (/point_cloud\/iteration_\d+\/point_cloud\.ply/i.test(path)) score += 1000;
            if (lower.indexOf('point_cloud') !== -1) score += 100;
            // 高迭代数优先 (iteration_30000 > iteration_7000)
            var iter = path.match(/iteration_(\d+)/);
            if (iter) score += parseInt(iter[1]) / 1000;
            // 文件名匹配
            if (/point_cloud\.(ply|splat|spz|ksplat)$/i.test(path)) score += 50;
            if (/scene\.(ply|splat|spz|ksplat)$/i.test(path)) score += 40;
            // 避免 input.ply (这是输入点云，不是训练结果)
            if (/input\.ply$/i.test(path)) score -= 100;
            return score;
        }

        // ========== 拖拽 ==========
        var appEl = document.getElementById('app');

        appEl.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.stopPropagation();
            appEl.classList.add('drag-over');
        });
        appEl.addEventListener('dragleave', function(e) {
            e.preventDefault();
            appEl.classList.remove('drag-over');
        });
        appEl.addEventListener('drop', async function(e) {
            e.preventDefault();
            e.stopPropagation();
            appEl.classList.remove('drag-over');

            // 检查是否是文件夹拖拽 (DataTransferItemList API)
            var items = e.dataTransfer && e.dataTransfer.items;
            if (items && items.length > 0 && items[0].webkitGetAsEntry) {
                var entry = items[0].webkitGetAsEntry();
                if (entry && entry.isDirectory) {
                    setStatus('Scanning dropped folder...');
                    var allFiles = await readFolderEntries(entry);
                    console.log('[3DGS] Folder dropped with', allFiles.length, 'files');
                    handleFolderFiles(allFiles);
                    return;
                }
            }

            // 单文件拖拽
            var files = e.dataTransfer && e.dataTransfer.files;
            if (!files || files.length === 0) return;
            var file = files[0];
            if (engineReady && engine) {
                loadModelFile(file);
            } else {
                pendingFile = file;
                setStatus('File queued: ' + file.name + ' (waiting for engine...)');
            }
        });

        // 递归读取文件夹内的所有文件 (用于拖拽文件夹场景)
        async function readFolderEntries(entry, path) {
            path = path || '';
            var results = [];
            if (entry.isFile) {
                var file = await new Promise(function(r) { entry.file(r); });
                // 添加 webkitRelativePath 兼容字段
                Object.defineProperty(file, 'webkitRelativePath', {
                    value: path + entry.name,
                    writable: false
                });
                results.push(file);
            } else if (entry.isDirectory) {
                var reader = entry.createReader();
                var entries = await new Promise(function(r) { reader.readEntries(r); });
                for (var i = 0; i < entries.length; i++) {
                    var sub = await readFolderEntries(entries[i], path + entry.name + '/');
                    results = results.concat(sub);
                }
            }
            return results;
        }

        // 处理一组文件夹文件 (与 folder-input change 相同逻辑)
        async function handleFolderFiles(files) {
            var modelCandidates = files.filter(function(f) {
                var ext = f.name.split('.').pop().toLowerCase();
                return ['ply', 'splat', 'spz', 'ksplat'].indexOf(ext) !== -1;
            });

            if (modelCandidates.length === 0) {
                setStatus('No splat file found in folder');
                return;
            }

            modelCandidates.sort(function(a, b) {
                return scoreModelPath(b.webkitRelativePath || b.name) - scoreModelPath(a.webkitRelativePath || a.name);
            });
            var modelFile = modelCandidates[0];

            var camerasJson = files.find(function(f) { return f.name === 'cameras.json'; });
            if (camerasJson) {
                try {
                    var text = await camerasJson.text();
                    sceneCameras = JSON.parse(text);
                    setStatus('Found ' + sceneCameras.length + ' training cameras');
                } catch(err) { sceneCameras = null; }
            }

            if (engineReady && engine) {
                loadModelFile(modelFile);
            } else {
                pendingFile = modelFile;
            }
        }

        // ========== Mode 切换 ==========
        document.querySelectorAll('.mode-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                setMode(btn.dataset.mode);
            });
        });

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.mode-btn').forEach(function(btn) {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            document.querySelectorAll('.panel-section').forEach(function(panel) {
                panel.classList.toggle('hidden', panel.dataset.panel !== mode);
            });
            var timeline = document.getElementById('timeline');
            if (timeline) timeline.classList.toggle('hidden', mode !== 'path');

            if (engine && engine.setMode) engine.setMode(mode);
            setStatus('Mode: ' + mode.charAt(0).toUpperCase() + mode.slice(1));
        }

        // ========== 加载模型 ==========
        async function loadModelFile(file) {
            if (!engine) {
                setStatus('Engine not ready');
                return;
            }
            showLoading('Loading ' + file.name + '...');
            try {
                var result = await engine.loadModel(file, function(progress) {
                    if (loadingProgress) loadingProgress.style.width = (progress * 100) + '%';
                    if (loadingTextEl) loadingTextEl.textContent = 'Loading... ' + Math.round(progress * 100) + '%';
                });
                hideLoading();
                if (splatCount) splatCount.textContent = 'Splats: ' + (result.splatCount || 0).toLocaleString();
                setStatus('Loaded ' + file.name + ' - ' + (result.splatCount || 0).toLocaleString() + ' splats');
            } catch (err) {
                hideLoading();
                setStatus('Load error: ' + err.message);
                console.error(err);
            }
        }

        // ========== 3D 引擎异步加载 ==========
        setStatus('Loading 3D engine...');

        async function initEngine() {
            try {
                // 直接用 importmap 中定义的 bare specifier
                var THREE = await import('three');
                setStatus('THREE.js loaded. Loading Spark.js...');

                var sparkModule = null;
                try {
                    sparkModule = await import('@sparkjsdev/spark');
                    console.log('[3DGS] Spark.js loaded! Exports:', Object.keys(sparkModule));
                } catch(sparkErr) {
                    console.error('[3DGS] Spark.js load FAILED:', sparkErr);
                    setStatus('Spark.js load error: ' + sparkErr.message);
                }

                engine = createEngine(THREE, sparkModule);
                engineReady = true;

                if (sparkModule) {
                    setStatus('Ready - WASD/QE move, Mouse drag rotate, Wheel zoom | Load File or Folder');
                } else {
                    setStatus('Ready (Spark.js unavailable - see F12 console for fix)');
                }

                // 绑定 View 面板按钮
                var btnFrame = document.getElementById('btn-frame');
                var btnReset = document.getElementById('btn-reset-camera');
                var fovSlider = document.getElementById('fov-slider');
                var fovValue = document.getElementById('fov-value');

                if (btnFrame) btnFrame.addEventListener('click', function() {
                    if (engine && engine.frameScene) engine.frameScene();
                });
                if (btnReset) btnReset.addEventListener('click', function() {
                    if (engine && engine.resetCamera) engine.resetCamera();
                });
                if (fovSlider) fovSlider.addEventListener('input', function(e) {
                    var fov = parseFloat(e.target.value);
                    if (fovValue) fovValue.textContent = fov;
                    if (engine && engine.setFov) engine.setFov(fov);
                });

                // 处理等待中的文件
                if (pendingFile) {
                    var f = pendingFile;
                    pendingFile = null;
                    loadModelFile(f);
                }
            } catch(err) {
                console.error('Engine load failed:', err);
                setStatus('Engine load failed: ' + err.message);
            }
        }

        function createEngine(THREE, sparkModule) {
            var canvas = document.getElementById('viewport');
            var scene = new THREE.Scene();
            var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
            camera.position.set(2, 1.5, 3);

            var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x1a1a2e);

            // Spark renderer - 必须传入 renderer
            var sparkRenderer = null;
            if (sparkModule && sparkModule.SparkRenderer) {
                try {
                    sparkRenderer = new sparkModule.SparkRenderer({ renderer: renderer });
                    scene.add(sparkRenderer);
                    console.log('[3DGS] SparkRenderer initialized');
                } catch(e) {
                    console.warn('SparkRenderer init failed:', e);
                    // 尝试不带参数
                    try {
                        sparkRenderer = new sparkModule.SparkRenderer();
                        scene.add(sparkRenderer);
                    } catch(e2) {
                        console.warn('SparkRenderer fallback failed:', e2);
                    }
                }
            }

            // Grid
            var grid = new THREE.GridHelper(10, 20, 0x333366, 0x222244);
            scene.add(grid);

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            var dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 5);
            scene.add(dirLight);

            // Also adjust camera near/far planes for various model scales
            camera.near = 0.001;
            camera.far = 10000;
            camera.updateProjectionMatrix();

            // State (scoped to engine instance)
            var splatMesh = null;
            var frameCount = 0;
            var lastFpsTime = performance.now();
            var fps = 0;

            // ========== FPS-style 自由飞行控制 ==========
            // 使用 yaw/pitch 欧拉角，避免 spherical 的限位
            // 鼠标拖动 = 旋转视角；WASD/QE = 移动；滚轮 = 调整移动速度
            var yaw = 0;          // 水平角（绕 Y 轴）
            var pitch = 0;        // 垂直角（绕 X 轴），允许 -90~+90
            var moveSpeed = 1.0;  // 单位 米/秒
            var rotateSpeed = 0.003;
            var keys = {};
            var isDown = false, pBtn = -1, lastX = 0, lastY = 0;

            // 让相机使用 YXZ 顺序，避免 gimbal lock
            camera.rotation.order = 'YXZ';

            // 同步初始 yaw/pitch (从当前相机方向反推 yaw/pitch)
            function syncEulerFromCamera() {
                // 强制按 YXZ 顺序重新计算 euler，避免顺序不一致
                var e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                yaw = e.y;
                pitch = e.x;
                // 清掉 roll，避免画面歪斜
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }

            canvas.addEventListener('pointerdown', function(e) {
                isDown = true; pBtn = e.button;
                lastX = e.clientX; lastY = e.clientY;
                canvas.setPointerCapture(e.pointerId);
                // 让 canvas 获取焦点，确保 WASD 键盘事件
                if (canvas.focus) canvas.focus();
            });
            canvas.addEventListener('pointermove', function(e) {
                if (!isDown) return;
                var dx = e.clientX - lastX, dy = e.clientY - lastY;
                lastX = e.clientX; lastY = e.clientY;

                if (pBtn === 0 || pBtn === 2) {
                    // 左键/右键：旋转视角（FPS 鼠标视角）
                    yaw -= dx * rotateSpeed;
                    pitch -= dy * rotateSpeed;
                    // 不限位 — 允许完全任意角度（虽然 pitch>90度会上下翻转）
                    pitch = Math.max(-Math.PI / 2 + 0.001, Math.min(Math.PI / 2 - 0.001, pitch));
                } else if (pBtn === 1) {
                    // 中键：平移
                    var right = new THREE.Vector3();
                    var up = new THREE.Vector3();
                    right.setFromMatrixColumn(camera.matrixWorld, 0);
                    up.setFromMatrixColumn(camera.matrixWorld, 1);
                    camera.position.addScaledVector(right, -dx * 0.005 * moveSpeed);
                    camera.position.addScaledVector(up, dy * 0.005 * moveSpeed);
                }
            });
            canvas.addEventListener('pointerup', function(e) {
                isDown = false; pBtn = -1;
                canvas.releasePointerCapture(e.pointerId);
            });
            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                e.stopPropagation();
                // 滚轮 = 沿视线前进/后退（zoom in/out）
                // 步长跟随 moveSpeed（场景越大步长越大）
                var fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                var step = -e.deltaY * 0.002 * Math.max(1, moveSpeed);
                camera.position.addScaledVector(fwd, step);
                console.log('[3DGS] wheel zoom:', step.toFixed(3), 'speed:', moveSpeed.toFixed(2));
            }, { passive: false });
            canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });

            // 键盘事件 - 全局监听
            window.addEventListener('keydown', function(e) {
                // 忽略输入框中的按键
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
                keys[e.code] = true;
                // Debug: 第一次按键时打印
                if (!keys._logged && (e.code === 'KeyW' || e.code === 'KeyA' || e.code === 'KeyS' || e.code === 'KeyD')) {
                    console.log('[3DGS] WASD key detected:', e.code);
                    keys._logged = true;
                }
            }, false);
            window.addEventListener('keyup', function(e) {
                keys[e.code] = false;
            }, false);

            // 帧时间用于 WASD 移动速度计算
            var lastFrameTime = performance.now();

            function updateCamera() {
                var now = performance.now();
                var dt = Math.min(0.1, (now - lastFrameTime) / 1000);
                lastFrameTime = now;

                // 应用 yaw/pitch 到相机旋转
                camera.rotation.set(pitch, yaw, 0, 'YXZ');

                // WASD 移动
                var dir = new THREE.Vector3();
                if (keys['KeyW']) dir.z -= 1;
                if (keys['KeyS']) dir.z += 1;
                if (keys['KeyA']) dir.x -= 1;
                if (keys['KeyD']) dir.x += 1;
                if (keys['KeyE'] || keys['Space']) dir.y += 1;
                if (keys['KeyQ'] || keys['ShiftLeft'] || keys['ControlLeft']) dir.y -= 1;

                if (dir.lengthSq() > 0) {
                    dir.normalize();
                    // 加速键
                    var spd = moveSpeed;
                    if (keys['ShiftRight']) spd *= 4;
                    dir.multiplyScalar(spd * dt);
                    // 应用到相机本地坐标
                    dir.applyQuaternion(camera.quaternion);
                    camera.position.add(dir);
                }
            }

            // 暴露给 API：从外部设置相机姿态
            function setCameraPose(position, quaternion) {
                camera.position.copy(position);
                camera.quaternion.copy(quaternion);
                syncEulerFromCamera();
            }

            // Resize
            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Render loop
            function loop() {
                requestAnimationFrame(loop);
                updateCamera();
                renderer.render(scene, camera);
                frameCount++;
                var now = performance.now();
                if (now - lastFpsTime >= 1000) {
                    fps = frameCount;
                    frameCount = 0;
                    lastFpsTime = now;
                    if (fpsCounter) fpsCounter.textContent = 'FPS: ' + fps;
                }
            }
            loop();

            // API
            return {
                loadModel: async function(file, onProgress) {
                    if (!sparkModule || !sparkModule.SplatMesh) {
                        throw new Error('Spark.js not loaded. Cannot load splat files.');
                    }

                    if (splatMesh) {
                        scene.remove(splatMesh);
                        if (splatMesh.dispose) splatMesh.dispose();
                        splatMesh = null;
                    }

                    var url = URL.createObjectURL(file);
                    var ext = file.name.split('.').pop().toLowerCase();

                    // 重要: blob URL 没有扩展名后缀，必须显式指定 fileType
                    var opts = { url: url, fileType: ext };
                    console.log('[3DGS] Creating SplatMesh with:', opts);

                    var newMesh;
                    try {
                        newMesh = new sparkModule.SplatMesh(opts);
                    } catch(constructErr) {
                        console.error('SplatMesh constructor error:', constructErr);
                        try {
                            newMesh = new sparkModule.SplatMesh();
                            if (newMesh.loadAsync) {
                                await newMesh.loadAsync(url, { fileType: ext });
                            } else if (newMesh.load) {
                                await newMesh.load(url, { fileType: ext });
                            }
                        } catch(e2) {
                            URL.revokeObjectURL(url);
                            throw e2;
                        }
                    }

                    splatMesh = newMesh;
                    // 3DGS/COLMAP 坐标系: Y朝下, Z朝前
                    // Three.js 坐标系: Y朝上, Z朝后
                    // 绕X轴旋转180° 让场景正立显示
                    splatMesh.rotation.x = Math.PI;
                    scene.add(splatMesh);
                    console.log('[3DGS] SplatMesh added to scene (rotated 180° around X):', splatMesh);

                    if (onProgress) onProgress(1);

                    // 等待模型实际加载完成（SplatMesh 的 url 加载是异步的）
                    // 轮询等待 packedSplats 就绪
                    var count = 0;
                    var waited = 0;
                    while (waited < 30000) { // 最多等30秒
                        if (splatMesh.packedSplats && splatMesh.packedSplats.splatCount > 0) {
                            count = splatMesh.packedSplats.splatCount;
                            break;
                        }
                        // 检查是否有 loaded/ready 事件
                        if (splatMesh.loaded || splatMesh.ready) {
                            count = splatMesh.packedSplats?.splatCount || splatMesh.count || 0;
                            break;
                        }
                        await new Promise(function(r) { setTimeout(r, 200); });
                        waited += 200;
                        if (onProgress) onProgress(Math.min(0.9, waited / 10000));
                    }

                    if (onProgress) onProgress(1);

                    // Auto frame - 多次尝试，因为 Spark 异步初始化 bounding box
                    var frameAttempts = 0;
                    function autoFrame() {
                        try {
                            // 先获取场景边界（用作相机看向的中心点）
                            var sceneCenter = new THREE.Vector3(0, 0, 0);
                            var sceneRadius = 3;

                            if (splatMesh.packedSplats && splatMesh.packedSplats.getBounds) {
                                var bounds = splatMesh.packedSplats.getBounds();
                                if (bounds && bounds.center) {
                                    sceneCenter.fromArray(bounds.center);
                                    sceneRadius = bounds.radius || 3;
                                }
                            } else {
                                var box = new THREE.Box3().setFromObject(splatMesh);
                                if (!box.isEmpty()) {
                                    box.getCenter(sceneCenter);
                                    var size = new THREE.Vector3();
                                    box.getSize(size);
                                    sceneRadius = size.length() * 0.5;
                                }
                            }
                            sceneRadius = Math.max(sceneRadius, 0.5);

                            // 使用 SIBR cameras.json 的第一个相机的位置（不用它的旋转，避免倒立问题）
                            // 直接用 position + lookAt(sceneCenter) 保证朝向正确
                            if (sceneCameras && sceneCameras.length > 0 && sceneCameras[0].position) {
                                var pos = sceneCameras[0].position;
                                camera.position.set(pos[0], pos[1], pos[2]);
                                camera.up.set(0, 1, 0);
                                camera.lookAt(sceneCenter);
                                syncEulerFromCamera();

                                // FOV 从 cameras.json 提取
                                if (sceneCameras[0].fy && sceneCameras[0].height) {
                                    camera.fov = 2 * Math.atan(sceneCameras[0].height / (2 * sceneCameras[0].fy)) * 180 / Math.PI;
                                    camera.updateProjectionMatrix();
                                }

                                moveSpeed = Math.max(0.1, sceneRadius * 0.3);
                                console.log('[3DGS] Camera at training pos[0], looking at scene center:', {
                                    pos: pos,
                                    center: sceneCenter.toArray(),
                                    radius: sceneRadius,
                                    moveSpeed: moveSpeed
                                });
                                return;
                            }

                            // 没有 cameras.json: 把相机放到场景外侧，朝向中心
                            camera.position.set(
                                sceneCenter.x + sceneRadius * 1.5,
                                sceneCenter.y + sceneRadius * 0.8,
                                sceneCenter.z + sceneRadius * 1.5
                            );
                            camera.up.set(0, 1, 0);
                            camera.lookAt(sceneCenter);
                            syncEulerFromCamera();
                            moveSpeed = Math.max(0.1, sceneRadius * 0.3);
                            console.log('[3DGS] Camera framed - center:', sceneCenter, 'radius:', sceneRadius);
                        } catch(frameErr) {
                            console.warn('Auto frame failed:', frameErr);
                            camera.position.set(3, 2, 5);
                            camera.up.set(0, 1, 0);
                            camera.lookAt(0, 0, 0);
                            syncEulerFromCamera();
                        }

                        frameAttempts++;
                        if (frameAttempts < 3) setTimeout(autoFrame, 500);
                    }
                    setTimeout(autoFrame, 500);

                    return { splatCount: count };
                },
                setMode: function(m) { /* TODO */ },
                frameScene: function() {
                    if (!splatMesh) return;
                    var center = new THREE.Vector3();
                    var radius = 3;
                    if (splatMesh.packedSplats && splatMesh.packedSplats.getBounds) {
                        var b = splatMesh.packedSplats.getBounds();
                        if (b && b.center) { center.fromArray(b.center); radius = b.radius || 3; }
                    } else {
                        var box = new THREE.Box3().setFromObject(splatMesh);
                        if (!box.isEmpty()) { box.getCenter(center); radius = box.getSize(new THREE.Vector3()).length() * 0.5; }
                    }
                    radius = Math.max(radius, 0.5);
                    camera.position.set(center.x + radius * 1.5, center.y + radius * 0.8, center.z + radius * 1.5);
                    camera.up.set(0, 1, 0);
                    camera.lookAt(center);
                    syncEulerFromCamera();
                    moveSpeed = Math.max(0.1, radius * 0.3);
                    console.log('[3DGS] frameScene -> center:', center, 'speed:', moveSpeed);
                },
                resetCamera: function() {
                    // 重置到训练相机第一帧（如果有）或默认位置
                    if (sceneCameras && sceneCameras.length > 0) {
                        var center = new THREE.Vector3();
                        if (splatMesh && splatMesh.packedSplats && splatMesh.packedSplats.getBounds) {
                            var b = splatMesh.packedSplats.getBounds();
                            if (b && b.center) center.fromArray(b.center);
                        }
                        var pos = sceneCameras[0].position;
                        camera.position.set(pos[0], pos[1], pos[2]);
                        camera.up.set(0, 1, 0);
                        camera.lookAt(center);
                        syncEulerFromCamera();
                    } else {
                        this.frameScene();
                    }
                    console.log('[3DGS] resetCamera done');
                },
                setFov: function(fov) {
                    camera.fov = fov;
                    camera.updateProjectionMatrix();
                }
            };
        }

        // 启动引擎加载
        initEngine();

    })();
    </script>
</body>
</html>
